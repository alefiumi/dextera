<html lang="it">

<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2a30;--mut:#5d6970;--acc:#0f766e;--on-acc:#fff;--line:#e3ded2}
/* tema: segue il sistema; il pulsante 🌙/☀️ lo forza (data-theme su <html>, salvato in localStorage 'dextera-theme') */
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12181b;--card:#1b2428;--ink:#e8eef0;--mut:#93a1a8;--acc:#2dd4bf;--on-acc:#05221f;--line:#2a363b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12181b;--card:#1b2428;--ink:#e8eef0;--mut:#93a1a8;--acc:#2dd4bf;--on-acc:#05221f;--line:#2a363b;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;height:100svh;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line);font-size:13px}
header b{font-size:14px}
header span{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums}
#bar{display:flex;gap:6px;padding:6px 10px;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
#bar button{flex:none;font:inherit;font-size:13px;font-weight:600;min-height:36px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap;box-shadow:0 1px 2px #0000000d;cursor:pointer}
#bar #home{min-width:40px;font-size:16px}
#bar button:focus-visible,button.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#bar button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
#view{flex:1 1 0;min-height:0;position:relative;touch-action:none}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);pointer-events:none;text-align:center;padding:20px}
#lfail{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;padding:10px 14px;border-radius:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 16px #0003;font-size:14px}
#lfail[hidden]{display:none}
/* caricamento: il logo con il satellite che gira (come nella schermata di avvio dell'app), al centro del riquadro */
.aload{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--mut);font-size:14px}
.aload .glogo{border-radius:16px;box-shadow:0 6px 24px #312e8140}
.glogo .lgm-go{animation:lgorb 2.6s linear infinite}.glogo .lgm-st{display:none}
#busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
#busy[hidden]{display:none}
#busy .aload{background:var(--card);padding:14px 18px;border-radius:18px;border:1px solid var(--line);box-shadow:0 6px 24px #0002}
@media (prefers-reduced-motion:reduce){.glogo .lgm-go{display:none}.glogo .lgm-st{display:inline}}
@keyframes lgorb{0.0%{transform:translate(446.0px,256.0px)} 2.778%{transform:translate(443.1px,266.8px)} 5.556%{transform:translate(434.5px,277.2px)} 8.333%{transform:translate(420.5px,287.0px)} 11.111%{transform:translate(401.5px,295.9px)} 13.889%{transform:translate(378.1px,303.5px)} 16.667%{transform:translate(351.0px,309.7px)} 19.444%{transform:translate(321.0px,314.3px)} 22.222%{transform:translate(289.0px,317.1px)} 25.0%{transform:translate(256.0px,318.0px)} 27.778%{transform:translate(223.0px,317.1px)} 30.556%{transform:translate(191.0px,314.3px)} 33.333%{transform:translate(161.0px,309.7px)} 36.111%{transform:translate(133.9px,303.5px)} 38.889%{transform:translate(110.5px,295.9px)} 41.667%{transform:translate(91.5px,287.0px)} 44.444%{transform:translate(77.5px,277.2px)} 47.222%{transform:translate(68.9px,266.8px)} 50.0%{transform:translate(66.0px,256.0px)} 52.778%{transform:translate(68.9px,245.2px)} 55.556%{transform:translate(77.5px,234.8px)} 58.333%{transform:translate(91.5px,225.0px)} 61.111%{transform:translate(110.5px,216.1px)} 63.889%{transform:translate(133.9px,208.5px)} 66.667%{transform:translate(161.0px,202.3px)} 69.444%{transform:translate(191.0px,197.7px)} 72.222%{transform:translate(223.0px,194.9px)} 75.0%{transform:translate(256.0px,194.0px)} 77.778%{transform:translate(289.0px,194.9px)} 80.556%{transform:translate(321.0px,197.7px)} 83.333%{transform:translate(351.0px,202.3px)} 86.111%{transform:translate(378.1px,208.5px)} 88.889%{transform:translate(401.5px,216.1px)} 91.667%{transform:translate(420.5px,225.0px)} 94.444%{transform:translate(434.5px,234.8px)} 97.222%{transform:translate(443.1px,245.2px)} 100.0%{transform:translate(446.0px,256.0px)}}
#pw{flex:none;position:relative;display:flex;flex-direction:column;max-height:42vh;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -2px 8px #0000000f}
#panel{flex:1 1 auto;min-height:86px;overflow:auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
#fold{position:absolute;z-index:3;top:-14px;right:12px;width:28px;height:28px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 1px 4px #0002;cursor:pointer}
#fold:before{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:translate(-50%,-70%) rotate(45deg);transition:transform .2s}
#pw.fold #fold:before{transform:translate(-50%,-30%) rotate(-135deg)}
#pw.fold #panel{min-height:0;max-height:68px;padding-top:8px;padding-bottom:8px;-webkit-mask-image:linear-gradient(#000 70%,#0008);mask-image:linear-gradient(#000 70%,#0008)}
#pw.fold .gh{display:none}
#panel .kick{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
#panel .h{font-size:20px;line-height:1.2;font-weight:700;margin:2px 0 4px}#panel .h i{font-weight:400;color:var(--mut);font-size:14px}
#panel .mut{color:var(--mut);font-size:14px}
#panel p{margin:6px 0}
#panel .row{margin:6px 0;font-size:14px}
#panel .sub{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
#panel .note{color:var(--mut);font-size:12px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
button.chip{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:38px;text-align:left;cursor:pointer}
.hub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.hub button.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;min-height:64px;font-weight:600;font-size:13px;background:var(--card);border-radius:14px;box-shadow:0 1px 3px #0000000d}
button.chip small{color:var(--mut)}
button.chip.o{border-color:#2563eb}button.chip.i{border-color:#ea580c}
button.chip.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
button.chip.on small{color:inherit;opacity:.9}
#q{width:100%;font:inherit;font-size:16px;padding:9px 12px;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.tg{display:inline-block;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.tg.o{background:#2563eb}.tg.i{background:#ea580c}
/* dentro la scheda "Atlante" dell'app (vista 3D): niente intestazione, la barra di navigazione dell'app sta sotto */
.emb header{display:none}.emb #theme{display:none} /* nell'app il pulsante sta nell'intestazione dell'app */
/* durante una partita: niente strati ed encefalo, la vista resta quella del gioco */
.game #layers,.game #brain,.game #bar [data-sys]{display:none}
.gh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.q{font-size:18px;margin-bottom:8px}.q i{font-weight:400;color:var(--mut);font-size:14px}
.res{text-align:center}.big{font-size:32px}.emb #panel{padding-bottom:10px}
/* computer e tablet in orizzontale: modello a sinistra e scheda a destra */
@media (min-width:900px) and (min-aspect-ratio:5/4){
body{display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,32vw,460px);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"h h" "b b" "v p"}
header{grid-area:h}#bar{grid-area:b}#view{grid-area:v}#pw{grid-area:p;max-height:none;border-top:0;border-left:1px solid var(--line);border-radius:0;box-shadow:none}
#fold{display:none}#pw.fold #panel{max-height:none;-webkit-mask-image:none;mask-image:none}#pw.fold .gh{display:flex}
}
</style>

<div id="pw"><button id="fold" aria-label="Abbassa la scheda" title="Abbassa la scheda"></button><div id="panel"><div class="mut">Caricamento…</div></div></div>
