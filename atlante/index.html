<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dextera – atlante 3D</title>
<script>try{const t=localStorage.getItem("dextera-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2a30;--mut:#6b7780;--acc:#0f766e;--line:#e3ded2}
/* tema: segue il sistema; il pulsante 🌙/☀️ lo forza (data-theme su <html>, salvato in localStorage 'dextera-theme') */
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12181b;--card:#1b2428;--ink:#e8eef0;--mut:#93a1a8;--acc:#2dd4bf;--line:#2a363b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12181b;--card:#1b2428;--ink:#e8eef0;--mut:#93a1a8;--acc:#2dd4bf;--line:#2a363b;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;height:100svh;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line);font-size:13px}
header b{font-size:14px}
header span{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums}
#bar{display:flex;gap:4px;padding:4px;overflow-x:auto;scrollbar-width:none}
#bar button{flex:none;font:inherit;font-size:12px;font-weight:600;padding:5px 9px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap}
#bar button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#view{flex:1 1 0;min-height:0;position:relative;touch-action:none}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);pointer-events:none;text-align:center;padding:20px}
#pw{flex:none;position:relative;display:flex;flex-direction:column;max-height:42vh;background:var(--card);border-top:1px solid var(--line)}
#panel{flex:1 1 auto;min-height:86px;overflow:auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
#fold{position:absolute;z-index:3;top:-14px;right:12px;width:28px;height:28px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 1px 4px #0002;cursor:pointer}
#fold:before{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:translate(-50%,-70%) rotate(45deg);transition:transform .2s}
#pw.fold #fold:before{transform:translate(-50%,-30%) rotate(-135deg)}
#pw.fold #panel{min-height:0;max-height:68px;padding-top:8px;padding-bottom:8px;-webkit-mask-image:linear-gradient(#000 70%,#0008);mask-image:linear-gradient(#000 70%,#0008)}
#pw.fold .gh{display:none}
#panel .h{font-size:17px;font-weight:700}#panel .h i{font-weight:400;color:var(--mut);font-size:14px}
#panel .mut{color:var(--mut);font-size:13px}
#panel p{margin:6px 0}
#panel .row{margin:6px 0;font-size:14px}
#panel .sub{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px}
#panel .note{color:var(--mut);font-size:12px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
button.chip{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:7px 11px;text-align:left}
button.chip small{color:var(--mut)}
button.chip.o{border-color:#2563eb}button.chip.i{border-color:#ea580c}
button.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.chip.on small{color:#ffffffcc}
#q{width:100%;font:inherit;font-size:16px;padding:9px 12px;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.tg{display:inline-block;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.tg.o{background:#2563eb}.tg.i{background:#ea580c}
/* dentro la scheda "Atlante" dell'app (vista 3D): niente intestazione, la barra di navigazione dell'app sta sotto */
.emb header{display:none}.emb #theme{display:none} /* nell'app il pulsante sta nell'intestazione dell'app */
/* durante una partita: niente strati ed encefalo, la vista resta quella del gioco */
.game #layers,.game #brain{display:none}
.gh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.q{font-size:18px;margin-bottom:8px}.q i{font-weight:400;color:var(--mut);font-size:14px}
.res{text-align:center}.big{font-size:32px}.emb #panel{padding-bottom:10px}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<script>if(window.parent!==window)document.body.classList.add('emb');</script>
<header><b>Atlante 3D</b><span id="fps"></span></header>
<div id="bar">
 <button id="layers">🧩 Strati</button><button id="brain">🧠 Encefalo</button><button data-v="front">Davanti</button><button data-v="back">Dietro</button><button data-v="right">Lato destro</button><button data-v="left">Lato sinistro</button><button data-v="top">Dall'alto</button>
 <button id="outline" class="on">Contorno</button><button id="theme">🌙</button>
</div>
<div id="view"><div id="msg">Caricamento del modello…</div></div>
<div id="pw"><button id="fold" aria-label="Abbassa la scheda" title="Abbassa la scheda"></button><div id="panel"><div class="mut">Caricamento…</div></div></div>
<script>
// freccia sul bordo della scheda: la abbassa (resta una striscia, il modello si allarga) e la rialza; scelta salvata
(()=>{const w=document.getElementById('pw'),b=document.getElementById('fold');
 const set=f=>{w.classList.toggle('fold',f);b.title=f?'Rialza la scheda':'Abbassa la scheda';b.setAttribute('aria-label',b.title);try{localStorage.setItem('dextera-fold3d',f?'1':'');}catch(e){}};
 try{set(!!localStorage.getItem('dextera-fold3d'));}catch(e){}
 b.addEventListener('click',()=>set(!w.classList.contains('fold')));})();
</script>
<script type="module" src="atlante.js"></script>
</body>
</html>
